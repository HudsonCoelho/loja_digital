<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login do ERP Estilo Único.">
  <meta name="theme-color" content="#0b0a12">
  <title>Login · Estilo Único</title>
  <!-- Favicon e ícone do site ao lado do endereço e título -->
  <link rel="icon" type="image/svg+xml" href="/static/erp/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/erp/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/erp/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/erp/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="/static/erp/img/favicon.ico">

  <!-- Tipografia local (100% offline) e estilos -->
  <link rel="stylesheet" href="/static/erp/css/styles.css?v=9">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      padding: 1rem;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      padding: 2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .login-card header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-card .brand__name {
      font-size: 1.5rem;
      display: block;
      color: var(--text);
    }
    .login-card .brand__tagline {
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <header>
      <div style="display:flex; justify-content:center; margin-bottom:0.75rem;">
        <svg style="width:52px; height:32px; color:var(--brand-400); filter: drop-shadow(0 0 12px var(--brand-glow));" viewBox="0 0 64 40" aria-hidden="true">
          <path d="M32 2l3 9-3 3-3-3 3-9zM4 12l10 8 8-12 6 14h8l6-14 8 12 10-8-6 26H10L4 12z" fill="currentColor"/>
        </svg>
      </div>
      <span class="brand__name">ESTILO <strong>ÚNICO</strong></span>
      <span class="brand__tagline" id="login-subtitle">Entrar no sistema</span>
    </header>
    
    <form id="login-form" aria-label="Formulário de login">
      <div id="setup-banner" style="margin-bottom:1.25rem; padding:0.85rem; border-radius:var(--radius-sm); background:rgba(124, 92, 230, 0.12); border:1px solid rgba(124, 92, 230, 0.3); font-size:0.825rem; line-height:1.4; color:var(--text);" hidden>
        <strong style="color:var(--brand-300); display:block; margin-bottom:0.25rem;">✨ Primeiro Acesso ao Sistema</strong>
        Nenhum usuário cadastrado. Crie a conta do <strong>Administrador Principal</strong> para ter acesso completo ao sistema.
      </div>

      <div class="field" id="nome-field" hidden>
        <label class="field__label" for="l-nome">Nome Completo do Administrador *</label>
        <input type="text" id="l-nome" name="nome" class="input" placeholder="Ex: Maria Silva">
      </div>
      <div class="field">
        <label class="field__label" for="l-login" id="label-login">Usuário *</label>
        <input type="text" id="l-login" name="login" class="input" required autocomplete="username" autofocus placeholder="Ex: admin">
      </div>
      <div class="field">
        <label class="field__label" for="l-senha" id="label-senha">Senha *</label>
        <input type="password" id="l-senha" name="senha" class="input" required autocomplete="current-password" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="field" id="confirma-field" hidden>
        <label class="field__label" for="l-confirma">Confirmar Senha *</label>
        <input type="password" id="l-confirma" name="confirma" class="input" placeholder="Repita a senha">
      </div>
      <div class="field" style="margin-top: 1.5rem;">
        <button type="submit" class="btn btn--primary" style="width: 100%; justify-content: center;" id="btn-submit">
          Entrar
        </button>
      </div>
      <p class="field__error" id="login-error" style="text-align: center; margin-top: 1rem;" hidden></p>
    </form>
  </div>

  <script type="module">
    import { api } from '/static/erp/js/core/api.js';

    const form = document.getElementById('login-form');
    const subtitle = document.getElementById('login-subtitle');
    const setupBanner = document.getElementById('setup-banner');
    const nomeField = document.getElementById('nome-field');
    const nomeInput = document.getElementById('l-nome');
    const confirmaField = document.getElementById('confirma-field');
    const confirmaInput = document.getElementById('l-confirma');
    const btnSubmit = document.getElementById('btn-submit');
    const errorMsg = document.getElementById('login-error');

    let mode = 'login'; // or 'setup'

    // Check if it's the first time setup
    async function checkSetup() {
      try {
        const res = await fetch('/api/auth/estado');
        const data = await res.json();
        if (data.csrf) window.CSRF_TOKEN = data.csrf;
        
        if (data.precisa_setup) {
          mode = 'setup';
          subtitle.textContent = 'Criar Administrador (Primeiro Acesso)';
          setupBanner.hidden = false;
          nomeField.hidden = false;
          nomeInput.required = true;
          confirmaField.hidden = false;
          confirmaInput.required = true;
          btnSubmit.textContent = 'Criar Administrador e Iniciar';
        }
      } catch (err) {
        console.error('Failed to check auth status', err);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.hidden = true;

      if (mode === 'setup') {
        const senha = form.senha.value || '';
        const confirma = form.confirma.value || '';
        if (senha.length < 6) {
          errorMsg.textContent = 'A senha deve ter pelo menos 6 caracteres.';
          errorMsg.hidden = false;
          return;
        }
        if (senha !== confirma) {
          errorMsg.textContent = 'A confirmação de senha não coincide com a senha digitada.';
          errorMsg.hidden = false;
          return;
        }
      }

      btnSubmit.disabled = true;

      try {
        if (mode === 'setup') {
          await api.post('/api/auth/setup', {
            nome: nomeInput.value,
            login: form.login.value,
            senha: form.senha.value
          });
          window.location.href = '/';
        } else {
          await api.post('/api/auth/login', {
            login: form.login.value,
            senha: form.senha.value
          });
          window.location.href = '/';
        }
      } catch (err) {
        errorMsg.textContent = err.message || 'Erro ao realizar login.';
        errorMsg.hidden = false;
      } finally {
        btnSubmit.disabled = false;
      }
    });

    checkSetup();
  </script>
</body>
</html>
